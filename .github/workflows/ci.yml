name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  llvm-19:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LLVM_ROOT: /usr/lib/llvm-19
    steps:
      - uses: actions/checkout@v4

      - name: Add official LLVM 19 repository
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates \
            curl \
            gnupg
          curl --fail --silent --show-error \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor --yes \
                --output /usr/share/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update

      - name: Install LLVM and MLIR 19
        run: |
          sudo apt-get install --yes --no-install-recommends \
            clang-19 \
            cmake \
            libmlir-19-dev \
            llvm-19-dev \
            llvm-19-tools \
            mlir-19-tools \
            ninja-build \
            python3
          clang++-19 --version
          /usr/lib/llvm-19/bin/mlir-opt --version

      - name: Locate distro lit
        run: |
          lit_path="$(find /usr/lib/llvm-19 -name lit.py -print -quit)"
          test -n "${lit_path}"
          echo "LLVM_LIT=${lit_path}" >> "${GITHUB_ENV}"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DLLVM_DIR="${LLVM_ROOT}/lib/cmake/llvm" \
            -DMLIR_DIR="${LLVM_ROOT}/lib/cmake/mlir" \
            -DLLVM_EXTERNAL_LIT="${LLVM_LIT}"

      - name: Build
        run: cmake --build build --target warpforge-opt --parallel 2

      - name: Run lit and Python tests
        run: |
          cmake --build build --target check-warpforge
          python3 -m unittest discover -s test/python -v

      - name: Record deterministic pipeline evidence
        run: |
          python3 scripts/benchmark_pipeline.py \
            --warpforge-opt build/bin/warpforge-opt \
            --expected evidence/expected-pipeline.json \
            --output build/evidence/pipeline.json \
            --optimized-output build/evidence/optimized.mlir

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warpforge-llvm19-evidence
          path: |
            build/evidence/pipeline.json
            build/evidence/optimized.mlir
